name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs

      - name: Validate stats card
        run: |
          test -s profile/stats.svg
          grep -q '<svg' profile/stats.svg
          if grep -qE 'Something went wrong|Resource limits for this query exceeded' profile/stats.svg; then
            echo "::error::Stats generation returned an error card"
            exit 1
          fi

      - name: Commit cards
        run: |
          if git diff --quiet -- profile/stats.svg; then
            echo "Stats card is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update README cards"
          git push
